# Label set v1. Every option shown to the model and every scored label comes from here.
# Phrases are case-insensitive regular expressions. They are used to detect labels named in
# product text (kept labels only) and to redact text (kept and dropped labels, plus the
# redaction cues). v1 adds the abbreviations, misspellings and cues the data review found
# (2026-10-25).
version: v1

# Test and held-out items need at least this many training examples of their label.
min_train_support: 30

attributes:
  neckline:
    source_field: Neck
    question: Which neckline does this product have?
    # Any mention of the attribute, misspellings included ("necklne", "necline", "neckine"). Redaction
    # drops a clause that contains one.
    attribute_words: '\bneck(?:line|lines|s)?\b|\bnec?k?l?i?nes?\b|\bcollar(?:ed|s|less)?\b'
    # Words that describe the attribute. In the title and the leading noun phrase, where dropping
    # the clause would also drop the product type, a mention is removed together with the words
    # before it, back to the earliest of these within three words ("Round Red Neck"), or one word.
    head_modifiers: '(?:round|crew|v|scoop(?:ed)?|u|deep|boat|bateau|square|mandarin|chinese|band|nehru|polo|shirt|spread|button[- ]?down|cowl|high|mock|turtle|keyhole|henley|halter|sweetheart|tie[- ]?up|notch(?:ed)?|wide|shawl)'
    labels:
      - name: Round neck
        definition: A rounded neckline that sits close to the base of the neck.
        raw_values: [Round Neck]
        phrases: ['\bround[- ]?neck(?:line|ed)?\b', '\bcrew[- ]?neck(?:line)?\b', '\bcrew\b']
      - name: V-neck
        definition: A neckline that dips to a point at the front, forming a V.
        raw_values: [V-Neck]
        phrases: ['\bv[- ]?neck(?:line|ed)?\b', '\bv[- ]shaped neck(?:line)?\b']
      - name: Scoop neck
        definition: A wide U-shaped neckline that dips lower at the front than a round neck.
        raw_values: [Scoop Neck]
        phrases: ['\bscoop(?:ed)?[- ]?neck(?:line)?\b', '\bscoop(?:ed)?\b', '\bu[- ]neck(?:line)?\b',
                  '\bdeep[- ]round[- ]?neck(?:line)?\b']
      - name: Boat neck
        definition: A wide, shallow neckline that runs almost straight across from shoulder to shoulder.
        raw_values: [Boat Neck]
        phrases: ['\bboat[- ]?neck(?:line)?\b', '\bbateau\b']
      - name: Square neck
        definition: A neckline with straight sides and a straight front edge, forming a square.
        raw_values: [Square Neck]
        phrases: ['\bsquare[- ]?neck(?:line)?\b']
      - name: Mandarin collar
        definition: A short stand-up collar that does not fold over.
        raw_values: [Mandarin Collar]
        phrases: ['\bmandarin\b', '\bchinese collar\b', '\bband collar\b', '\bnehru collar\b']
      - name: Polo collar
        definition: A soft fold-over collar above a short buttoned placket, as on a polo shirt.
        raw_values: [Polo Collar]
        phrases: ['\bpolo\b']
      - name: Shirt collar
        definition: A pointed fold-over collar on a stand, as on a dress shirt.
        raw_values: [Shirt Collar]
        # "spread collar" is left out: it also describes polo and jersey collars (hand check, 2026-10-25).
        phrases: ['\bshirt collar\b', '\bbutton[- ]down collar\b', '\bcollared\b']
      - name: Cowl neck
        definition: A neckline with soft draped folds of fabric at the front.
        raw_values: [Cowl Neck]
        phrases: ['\bcowl\b']
    dropped:
      - reason: strap or shoulder style, not a neckline shape
        raw_values: [Shoulder Straps, Strapless, Off-Shoulder, One Shoulder, Halter Neck]
        phrases: ['\bshoulder[- ]straps?\b', '\bstraps?\b', '\bstrapped\b', '\bsp(?:h?a|e)g+h?e+t+i\b', '\bstrappy\b',
                  '\bstrapless\b', '\btube\b', '\boff[- ]?(?:the[- ])?shoulder\b', '\bone[- ]shoulder\b', '\bhalter\b']
      - reason: too rare, or not shared between seen and held-out categories
        raw_values: [Tie-Up Neck, High Neck, Mock Neck, Keyhole Neck, Henley Neck, Hood]
        phrases: ['\btie[- ]?up\b', '\bhigh[- ]?neck(?:ed)?\b', '\bturtle[- ]?neck\b', '\bmock[- ]?neck\b',
                  '\bkeyhole\b', '\bhenley\b', '\bhood(?:ed|ie|y)?\b', '\bsweetheart\b']

  sleeve_length:
    source_field: Sleeve Length
    question: What sleeve length does this product have?
    # Every word containing "leev" in the catalog is about sleeves, misspellings included
    # ("sleevless", "leeveless", "sleevesless"), and so are "slevees" and "slv".
    attribute_words: '\b\w*le{2,}v\w*\b|\bslev\w*\b|\bslv\b'
    head_modifiers: '(?:short|half|cap|three|quarter|fourth|3/4(?:th)?|elbow|long|full|length|no|roll(?:ed)?|puff(?:ed)?|bell|raglan|kimono|batwing|flutter|extended)'
    labels:
      - name: Short sleeves
        definition: Sleeves that end above the elbow.
        raw_values: [Short Sleeves]
        # SS and HS (half sleeves) appear in brand titles; every catalog use is short sleeves.
        phrases: ['\bshort[- ]sleeve[sd]?\b', '\bhalf[- ]sleeve[sd]?\b', '\bcap[- ]sleeve[sd]?\b',
                  '\b(?:ss|hs|s/s)\b']
      - name: Three-quarter sleeves
        definition: Sleeves that end between the elbow and the wrist.
        raw_values: [Three-Quarter Sleeves]
        # Must lead to "sleeve" within three words: "three quarter pants" is not about sleeves, and a
        # "mid-arm" button tab sits on rolled long sleeves (hand check, 2026-10-25).
        phrases: ['\bthree[- ]quarter(?:[- ]length)?(?:[\s-]+[\w-]+){0,3}?[\s-]+sleeve[sd]?\b',
                  '\b3/4(?:th)?(?:[- ]length)?(?:[\s-]+[\w-]+){0,3}?[\s-]+sleeve[sd]?\b']
      - name: Long sleeves
        definition: Sleeves that reach the wrist.
        raw_values: [Long Sleeves]
        # LS and FS (full sleeves) appear in brand titles; every catalog use is long sleeves.
        phrases: ['\blong[- ]sleeve[sd]?\b', '\bfull[- ]sleeve[sd]?\b', '\b(?:ls|fs|l/s)\b']
      - name: Sleeveless
        definition: No sleeves; the armhole is finished at the shoulder.
        raw_values: [Sleeveless, No Sleeves]
        # Strap styles describe a garment without sleeves, so they count as evidence too. "armholes" is
        # left out: sleeved tops mention armholes as well (hand check, 2026-10-25).
        phrases: ['\bs?lee?ve?s?les+\b', '\bno sleeves?\b', '\b(?:sless|s/l)\b', '\btank\b', '\bcami(?:sole)?s?\b',
                  '\bsp(?:h?a|e)g+h?e+t+i\b', '\bstrappy\b', '\bstrapless\b', '\btube\b', '\bhalter\b',
                  '\bracer\b', '\brace?r?[- ]?back\b', '\bshoulder[- ]straps?\b', '\bstraps\b']
    dropped: []
    # Words that point to a value without naming a label: removed in redaction only, since they are too
    # loose for label matching. Sleeved tops mention armholes too, but most items that do are sleeveless.
    redaction_cues: ['\barm[- ]?holes?\b', '\bstrap(?:ped)?\b']
    # Sleeves made to be worn rolled up are usually photographed rolled, so their length depends on a
    # convention rather than on what the photo shows. Products whose text describes them are left out of
    # this task in every split (decision 2026-10-25, from the hand check).
    # A roll-up phrase counts only near "sleeve" or "cuff", so "denims rolled up to the ankle" does not.
    exclude_if:
      reason: roll_up_sleeves
      raw_values: {Sleeve Styling: [Roll-Up Sleeves]}
      phrases: ['\broll(?:ed)?[- ]?up\b(?=[^.;]{0,40}\b(?:sleeve|cuff))', '\b(?:sleeve|cuff)\w*\b[^.;]{0,40}\broll(?:ed)?[- ]?up\b',
                '\broll[- ]?tabs?\b', '\btabbed sleeves?\b',
                '\b(?:button(?:ed)?|sleeve)[- ]tabs?\b', '\bmid[- ]?(?:arm|sleeve)\b',
                '\bfold[- ]?over sleeves?\b', '\bturn[- ]?up sleeves?\b', '\bconvertible sleeves?\b']
