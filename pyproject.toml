[project]
name = "product-attribute-confidence"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pillow>=13.0.0",
    "pyyaml>=6.0.3",
    "streamlit>=1.66.1",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=9.1.1",
]
gpu = [
    "accelerate==1.15.0 ; sys_platform == 'linux'",
    "peft==0.21.2 ; sys_platform == 'linux'",
    "vllm==0.32.0 ; sys_platform == 'linux'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pac"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# The laptop (macOS) and the GPU pod and CI (Linux) are the only places this runs.
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]
