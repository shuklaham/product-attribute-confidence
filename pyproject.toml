[project]
name = "product-attribute-confidence"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pillow>=13.0.0",
    "pyyaml>=6.0.3",
    "streamlit>=1.66.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pac"]

[tool.pytest.ini_options]
testpaths = ["tests"]
